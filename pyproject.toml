[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "excel2sql"
version = "2.0.0"
description = "将 Excel / CSV 转换为 SQL 文件（MySQL / PostgreSQL / SQLite），自动推断字段类型，流式处理大文件"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "末心", email = "1044631097@qq.com" }]
keywords = ["excel", "sql", "mysql", "postgresql", "sqlite", "etl", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = ["openpyxl>=3.0"]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
excel2sql = "excel2sql.cli:main"

[tool.setuptools.packages.find]
include = ["excel2sql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
